[project]
name = "repomind"
version = "0.1.0"
description = "RAG-powered code assistant for understanding any codebase"
authors = [
    {name = "Sohrab", email = "sohrabshaikh780@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-qdrant>=0.2.0",
    "langchain-huggingface>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "qdrant-client>=1.12.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-language-pack>=0.7.0",
    "sentence-transformers>=5.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.0",
    "streamlit (>=1.64.0,<2.0.0)",
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "fastembed (>=0.8.1,<0.9.0)",
]

[tool.poetry]
packages = [{include = "repomind"}]

[tool.poetry.scripts]
repomind = "repomind.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
